[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "site-watch-agent"
version = "0.1.0"
description = "FastAPI + worker website uptime monitoring with ClickUp Chat alerts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116.0,<1.0.0",
    "uvicorn[standard]>=0.35.0,<1.0.0",
    "httpx>=0.28.0,<1.0.0",
    "apscheduler>=3.10.4,<4.0.0",
    "sqlalchemy>=2.0.38,<3.0.0",
    "aiosqlite>=0.21.0,<1.0.0",
    "pydantic-settings>=2.8.0,<3.0.0",
    "structlog>=25.1.0,<26.0.0",
    "alembic>=1.14.1,<2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.4,<9.0.0",
    "pytest-asyncio>=0.25.3,<1.0.0",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"

testpaths = ["tests"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["app*"]
