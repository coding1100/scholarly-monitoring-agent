name: site-watch-agent

services:
  migrate:
    build: .
    env_file:
      - .env
    command: alembic upgrade head
    volumes:
      - ./data:/app/data

  api:
    build: .
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "${HOST_API_PORT:-8030}:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    env_file:
      - .env
    command: python -m app.worker
    volumes:
      - ./data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
